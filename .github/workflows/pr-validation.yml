name: PR validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgres://shareable_docs:shareable_docs@localhost:5432/shareable_docs

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A deploy failed with `column "clerk_user_id" does not exist` because the
    # migrations had never been applied to the target database and nothing in
    # CI would have noticed. This job proves, on every PR, that the migrations
    # apply to an empty database and that they still describe src/db/schema.ts.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shareable_docs
          POSTGRES_PASSWORD: shareable_docs
          POSTGRES_DB: shareable_docs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shareable_docs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://shareable_docs:shareable_docs@localhost:5432/shareable_docs

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Catches a corrupted journal: duplicate prefixes, or two migrations
      # generated in parallel on different branches.
      - name: Check migration journal consistency
        run: bunx drizzle-kit check --config=drizzle.config.ts

      # The real deploy failure: SQL that never ran anywhere. An empty database
      # is the only honest test of migrations that must run against one.
      - name: Apply migrations to an empty database
        run: bun run db:migrate

      # Applying twice must be a no-op. If a migration is not recorded properly
      # the second run re-executes it and fails on "already exists" — which is
      # exactly what a redeploy would hit.
      - name: Re-apply migrations to prove they are idempotent
        run: bun run db:migrate

      # Guards the other direction: someone edits src/db/schema.ts and ships it
      # without generating a migration. The app would then expect columns the
      # database has never been told about.
      - name: Check the schema and the migrations agree
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/db/schema.ts has changes with no matching migration."
            echo "Run 'bun run db:generate' and commit the generated files."
            git status --porcelain drizzle/
            git diff -- drizzle/
            exit 1
          fi
